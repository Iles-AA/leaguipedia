<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Champions — Leaguipedia</title>
    <link rel="stylesheet" href="CSS/champions.css">

</head>
<body>
<header class="main-header">
    <nav class="nav-container">
        <div class="logo">LEAGUI<span style="color:#c8aa6e">PEDIA</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="champions.html" class="active">Champions</a></li>
            <li><a href="tierlist.html">Tier List</a></li>
            <li><a href="esport.html">E-sport</a></li>
        </ul>
    </nav>
</header>

<div class="search-section">
    <input type="text" id="search-bar" placeholder="RECHERCHER UN CHAMPION...">
</div>

<div class="role-filters">
    <button class="role-btn active" data-lane="all">Tous</button>
    <button class="role-btn" data-lane="top">Top Lane</button>
    <button class="role-btn" data-lane="jungle">Jungle</button>
    <button class="role-btn" data-lane="mid">Mid Lane</button>
    <button class="role-btn" data-lane="adc">ADC</button>
    <button class="role-btn" data-lane="support">Support</button>
</div>

<div class="champions-count" id="count-display">Chargement...</div>

<main class="champions-container" id="champions-grid">
    <div class="loading-screen" style="grid-column:1/-1">
        <div class="loading-spin"></div>
        <div class="loading-text">Connexion à l'API Riot Games</div>
    </div>
</main>

<footer class="main-footer">
    <div class="footer-content">
        <p>Données fournies par <strong style="color:#c8aa6e">Riot Games Data Dragon API</strong></p>
        <p style="margin-top:8px;font-size:0.78rem">Leaguipedia n'est pas affilié à Riot Games</p>
    </div>
</footer>

<script>
const DD = 'https://ddragon.leagueoflegends.com';
let allChampions = [], currentLane = 'all', currentSearch = '', patchVersion = '';

// LANES

const LANES = {
    top: ['Aatrox','Akali','Ambessa','Camille','Cho\'Gath','Darius','DrMundo','Fiora','Gangplank',
          'Garen','Gnar','Gragas','Gwen','Illaoi','Irelia','Jax','Jayce','Kayle','KSante','Kennen',
          'Kled','Malphite','Maokai','Mordekaiser','Nasus','Olaf','Ornn','Pantheon','Poppy','Quinn',
          'Renekton','Riven','Rumble','Ryze','Sett','Shen','Singed','Sion','Teemo','Trundle',
          'Tryndamere','Urgot','Vayne','Volibear','Warwick','Wukong','Yorick','Fiora','Garen',
          'Heimerdinger','Akshan','Cassiopeia','Lissandra','Smolder'],
    jungle: ['Amumu','Belveth','Briar','Diana','Ekko','Elise','Evelynn','Fiddlesticks','Gragas',
             'Graves','Hecarim','Ivern','JarvanIV','Karthus','Kayn','Khazix','Kindred','LeeSin',
             'Lillia','MaitreYi','Mordekaiser','Naafiri','Nidalee','Nocturne','Nunu','Olaf',
             'Pantheon','Rammus','RekSai','Rengar','Sejuani','Shaco','Shyvana','Skarner','Taliyah',
             'Trundle','Udyr','Vi','Viego','Volibear','Warwick','Wukong','XinZhao','Zac','Jarvan IV'],
    mid: ['Ahri','Akali','Akshan','Anivia','Annie','Aurelion Sol','Aurora','Azir','Cassiopeia',
          'Corki','Diana','Ekko','Fizz','Galio','Gragas','Heimerdinger','Hwei','Irelia','Jayce',
          'Kassadin','Katarina','Leblanc','Lissandra','Lux','Malzahar','Neeko','Orianna','Pantheon',
          'Qiyana','Ryze','Seraphine','Sylas','Syndra','Taliyah','Talon','TwistedFate','Veigar',
          'Velkoz','Vex','Viktor','Vladimir','Xerath','Yasuo','Yone','Zed','Ziggs','Zoe','Asol'],
    adc: ['Aphelios','Ashe','Caitlyn','Corki','Draven','Ezreal','Jhin','Jinx','Kaisa','Kalista',
          'KogMaw','Lucian','MissFortune','Nilah','Quinn','Samira','Seraphine','Sivir','Smolder',
          'Tristana','Twitch','Varus','Vayne','Xayah','Zeri','Mel'],
    support: ['Alistar','Bard','Blitzcrank','Brand','Braum','Galio','Heimerdinger','Janna','Karma',
              'Leona','Lulu','Lux','Milio','Morgana','Nami','Nautilus','Neeko','Pyke','Rakan',
              'Rell','Renata','Seraphine','Senna','Sona','Soraka','Swain','Tahm Kench','Taric',
              'Thresh','Vel\'Koz','Xerath','Yuumi','Zilean','Zyra','Mel','Zaahen','TahmKench','Velkoz']
};

function normName(name) {
    return name.toLowerCase().replace(/['\s\-\.]/g, '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

const LANE_SETS = {};
for (const [lane, champs] of Object.entries(LANES)) {
    LANE_SETS[lane] = new Set(champs.map(normName));
}

function inLane(champion, lane) {
    if (lane === 'all') return true;
    return LANE_SETS[lane].has(normName(champion.id)) || LANE_SETS[lane].has(normName(champion.name));
}

const LANE_LABELS = { top:'Top Lane', jungle:'Jungle', mid:'Mid Lane', adc:'ADC', support:'Support' };

async function init() {
    try {
        const versions = await fetch(`${DD}/api/versions.json`).then(r => r.json());
        patchVersion = versions[0];
        const data = await fetch(`${DD}/cdn/${patchVersion}/data/fr_FR/champion.json`).then(r => r.json());
        allChampions = Object.values(data.data).map(c => ({
            id: c.id, name: c.name, title: c.title, tags: c.tags,
            difficulty: c.info.difficulty,
            img: `${DD}/cdn/${patchVersion}/img/champion/${c.image.full}`
        })).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
        render();
    } catch(e) {
        document.getElementById('champions-grid').innerHTML =
            `<div style="grid-column:1/-1;text-align:center;padding:80px;color:#a09b8c">
                <p style="color:#c8aa6e;font-size:1.2rem;letter-spacing:2px;margin-bottom:10px">ERREUR DE CONNEXION</p>
                <p>Impossible de contacter l'API Riot Games.</p>
                <p style="font-size:0.75rem;margin-top:8px">${e.message}</p>
            </div>`;
    }
}

const tagFR = { Fighter:'Fighter', Tank:'Tank', Mage:'Mage', Assassin:'Assassin', Marksman:'Tireur', Support:'Support' };

function dots(d) {
    const lvl = Math.round((d/10)*3);
    return [1,2,3].map(i => `<div class="diff-dot${i<=lvl?' filled':''}"></div>`).join('');
}

function getLaneBadges(champ) {
    return Object.entries(LANE_SETS)
        .filter(([lane, set]) => set.has(normName(champ.id)) || set.has(normName(champ.name)))
        .map(([lane]) => `<span class="tag-badge">${LANE_LABELS[lane]}</span>`)
        .join('');
}

function render() {
    const list = allChampions.filter(c =>
        inLane(c, currentLane) &&
        (c.name.toLowerCase().includes(currentSearch) || c.title.toLowerCase().includes(currentSearch))
    );
    const count = list.length;
    document.getElementById('count-display').textContent = `${count} champion${count>1?'s':''}`;
    document.getElementById('champions-grid').innerHTML = count === 0
        ? `<div style="grid-column:1/-1;text-align:center;padding:80px;color:#a09b8c;letter-spacing:2px;text-transform:uppercase">Aucun champion trouvé</div>`
        : list.map(c => `
            <a href="detail.html?id=${c.id}&v=${patchVersion}" class="champion-link">
                <article class="champion">
                    <img src="${c.img}" alt="${c.name}" loading="lazy">
                    <h2>${c.name}</h2>
                    <p>${c.title}</p>
                    <div class="champion-tags">${getLaneBadges(c)}</div>
                    <div class="champion-difficulty">${dots(c.difficulty)}</div>
                </article>
            </a>`).join('');
}

document.getElementById('search-bar').addEventListener('input', e => {
    currentSearch = e.target.value.toLowerCase().trim();
    render();
});
document.querySelectorAll('.role-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentLane = btn.dataset.lane;
    render();
}));

init();
</script>
</body>
</html>
