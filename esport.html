<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Leaguipedia - Calendrier E-sport</title>
    <link rel="stylesheet" href="CSS/esport.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">LEAGUI<span class="gold">PEDIA</span></div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">ACCUEIL</a></li>
                <li><a href="champions.html">CHAMPIONS</a></li>
                <li><a href="tierlist.html">TIERLIST</a></li>
                <li><a href="esport.html" class="active">E-SPORT</a></li>
            </ul>
        </nav>
    </header>

    <main class="esport-calendar">
        <h1 class="page-title">CALENDRIER DES COMPÉTITIONS</h1>

        <div class="match-list">
            <div class="list-category">EN DIRECT</div>
            
            <div class="match-row live">
                <div class="match-time">LIVE</div>
                <div class="match-team left">
                    <span>G2</span>
                    <img src="images/g2.png" alt="">
                </div>
                <div class="match-score">
                    <span class="score">1</span> - <span class="score">0</span>
                </div>
                <div class="match-team right">
                    <img src="images/fnc.png" alt="">
                    <span>FNC</span>
                </div>
                <div class="match-league">LEC</div>
            </div>
        </div>

        <div class="match-list">
            <div class="list-category">AUJOURD'HUI</div>
            
            <div class="match-row">
                <div class="match-time">20:00</div>
                <div class="match-team left">
                    <span>KC</span>
                    <img src="images/kc.png" alt="">
                </div>
                <div class="match-score">VS</div>
                <div class="match-team right">
                    <img src="images/vit.png" alt="">
                    <span>VIT</span>
                </div>
                <div class="match-league">LFL</div>
            </div>

            <div class="match-row">
                <div class="match-time">22:00</div>
                <div class="match-team left">
                    <span>T1</span>
                    <img src="images/t1.png" alt="">
                </div>
                <div class="match-score">VS</div>
                <div class="match-team right">
                    <img src="images/gen.png" alt="">
                    <span>GEN</span>
                </div>
                <div class="match-league">LCK</div>
            </div>
        </div>

        <div class="match-list">
            <div class="list-category">RÉSULTATS HIER</div>
            <div class="match-row finished">
                <div class="match-time">TERMINE</div>
                <div class="match-team left winner">
                    <span>MDK</span>
                    <img src="images/mdk.png" alt="">
                </div>
                <div class="match-score">
                    <span class="score">2</span> - <span class="score">0</span>
                </div>
                <div class="match-team right">
                    <img src="images/th.png" alt="">
                    <span>TH</span>
                </div>
                <div class="match-league">LEC</div>
            </div>
        </div>
    </main>

</body>
</html>
